auth_enabled: false
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 72h
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
querier:
  max_concurrent_queries: 4
query_frontend:
  search:
    concurrent_jobs: 4
    max_duration: 6h
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 2000000
      burst_size_bytes: 4000000
    global:
      max_bytes_per_trace: 1000000
