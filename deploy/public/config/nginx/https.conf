server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / { return 404; }
}

server {
    listen 80;
    server_name opsagent.cloud www.opsagent.cloud;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://opsagent.cloud$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.opsagent.cloud;
    include /etc/nginx/opsagent-snippets/tls.conf;
    return 301 https://opsagent.cloud$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name opsagent.cloud;
    server_tokens off;
    include /etc/nginx/opsagent-snippets/tls.conf;
    include /etc/nginx/opsagent-snippets/security-headers.conf;
    include /etc/nginx/opsagent-snippets/app-locations.conf;
}
