root /usr/share/nginx/html;
index index.html;
client_max_body_size 12m;

# Resolve gateway recreation through Docker DNS without requiring a web redeploy.
resolver 127.0.0.11 valid=10s ipv6=off;
set $opsagent_gateway ops-gateway-app:18080;

location = /actuator { return 404; }
location ^~ /actuator/ { return 404; }
location = /api/auth/register { return 404; }
location = /api/knowledge/internal { return 404; }
location ^~ /api/knowledge/internal/ { return 404; }

# These callbacks are container-to-container and never belong on the public site.
location = /api/integrations/alertmanager/webhook { return 404; }
location ~* ^/(?:api/)?(?:swagger-ui|v3/api-docs)(?:/|$) { return 404; }

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/opsagent-snippets/security-headers.conf;
}

location = /index.html {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/opsagent-snippets/security-headers.conf;
}

location /api/ {
    proxy_pass http://$opsagent_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering no always;
    include /etc/nginx/opsagent-snippets/security-headers.conf;
}

location ~ /\. { return 404; }

location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/opsagent-snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
}
