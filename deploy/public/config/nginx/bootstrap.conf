# Temporary HTTP validation entry point; switch to HTTPS before credential testing.
server {
    listen 80 default_server;
    server_name opsagent.cloud www.opsagent.cloud;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/opsagent-snippets/app-locations.conf;
}
