# Merge this service into the public Compose file. It has no host ports or Docker socket.
services:
  operations-lab:
    build: ../operations-lab
    restart: unless-stopped
    networks: [backplane]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 48m
    cpus: 0.25
    pids_limit: 16
    environment:
      OPS_OPERATIONS_LAB_TOKEN: ${OPS_OPERATIONS_LAB_TOKEN:?Set a random token of at least 32 characters}
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}

  ops-platform-app:
    environment:
      OPS_OPERATIONS_LAB_URL: http://operations-lab:8080
      OPS_OPERATIONS_LAB_TOKEN: ${OPS_OPERATIONS_LAB_TOKEN}
      OPS_OPERATIONS_RAG_URL: http://ops-rag-app:8104
      OPS_OPERATIONS_NACOS_URL: http://nacos:8848/nacos
      OPS_OPERATIONS_NACOS_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      OPS_OPERATIONS_NACOS_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      OPS_OPERATIONS_INSPECTION_ENABLED: "true"
      OPS_OPERATIONS_INSPECTION_INTERVAL_MS: "900000"
