name: opsagent

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${OPS_MYSQL_ROOT_PASSWORD:-opsagent_local}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${OPS_MYSQL_ROOT_PASSWORD:-opsagent_local}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OPS_REDIS_PASSWORD:-opsagent_local}"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${OPS_REDIS_PASSWORD:-opsagent_local}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v2.5.1
    profiles: ["middleware"]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports: ["8848:8848", "9848:9848"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["middleware"]
    environment:
      RABBITMQ_DEFAULT_USER: ${OPS_RABBITMQ_USERNAME:-opsagent}
      RABBITMQ_DEFAULT_PASS: ${OPS_RABBITMQ_PASSWORD:-opsagent_local}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    profiles: ["middleware"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${OPS_ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports: ["9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
