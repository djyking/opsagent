services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opsagent
      MYSQL_USER: ${OPSAGENT_DB_USERNAME:-opsagent}
      MYSQL_PASSWORD: ${OPSAGENT_DB_PASSWORD:-opsagent_local}
      MYSQL_ROOT_PASSWORD: ${OPSAGENT_DB_ROOT_PASSWORD:-root_local}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
