server:
  port: 8105
spring:
  application:
    name: ops-platform-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${OPS_PLATFORM_DB_URL:jdbc:mysql://localhost:3306/ops_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${OPS_PLATFORM_DB_USERNAME:root}
    password: ${OPS_PLATFORM_DB_PASSWORD:}
  rabbitmq:
    host: ${OPS_RABBITMQ_HOST:localhost}
    port: ${OPS_RABBITMQ_PORT:5672}
    username: ${OPS_RABBITMQ_USERNAME:opsagent}
    password: ${OPS_RABBITMQ_PASSWORD:opsagent_local}
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      eager: ${SENTINEL_EAGER:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
ops:
  agent:
    internal-secret: ${OPS_AGENT_INTERNAL_SECRET:}
    auth-url: ${OPS_AUTH_INTERNAL_URL:http://localhost:8101}
  security:
    secret: ${OPS_JWT_SECRET:}
    permit-all:
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /internal/platform/demo-targets/order/**
  monitor:
    prometheus-url: ${OPS_PROMETHEUS_URL:http://localhost:9090}
    grafana-url: ${OPS_GRAFANA_URL:http://localhost:3000}
    prometheus-public-url: ${OPS_PROMETHEUS_PUBLIC_URL:http://localhost:9090}
    grafana-public-url: ${OPS_GRAFANA_PUBLIC_URL:http://localhost:3000}
  operations:
    demo-target-url: ${OPS_DEMO_TARGET_URL:}
    demo-target-token: ${OPS_DEMO_CONTROL_TOKEN:}
    initialize-schema: ${OPS_OPERATIONS_INITIALIZE_SCHEMA:true}
    inspection-enabled: ${OPS_OPERATIONS_INSPECTION_ENABLED:false}
    inspection-interval-ms: ${OPS_OPERATIONS_INSPECTION_INTERVAL_MS:900000}
    inspection-initial-delay-ms: ${OPS_OPERATIONS_INSPECTION_INITIAL_DELAY_MS:120000}
    nacos-url: ${OPS_OPERATIONS_NACOS_URL:http://${NACOS_SERVER_ADDR:localhost:8848}/nacos}
    nacos-username: ${OPS_OPERATIONS_NACOS_USERNAME:}
    nacos-password: ${OPS_OPERATIONS_NACOS_PASSWORD:}
    nacos-identity-key: ${OPS_OPERATIONS_NACOS_IDENTITY_KEY:}
    nacos-identity-value: ${OPS_OPERATIONS_NACOS_IDENTITY_VALUE:}
    nacos-namespace: ${OPS_OPERATIONS_NACOS_NAMESPACE:}
    rag-url: ${OPS_OPERATIONS_RAG_URL:http://localhost:8104}
    lab-url: ${OPS_OPERATIONS_LAB_URL:}
    lab-token: ${OPS_OPERATIONS_LAB_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
