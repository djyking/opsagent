server:
  port: 8105
spring:
  application:
    name: ops-platform-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${OPS_PLATFORM_DB_URL:jdbc:mysql://localhost:3306/ops_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${OPS_PLATFORM_DB_USERNAME:root}
    password: ${OPS_PLATFORM_DB_PASSWORD:}
  rabbitmq:
    host: ${OPS_RABBITMQ_HOST:localhost}
    port: ${OPS_RABBITMQ_PORT:5672}
    username: ${OPS_RABBITMQ_USERNAME:opsagent}
    password: ${OPS_RABBITMQ_PASSWORD:opsagent_local}
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      eager: ${SENTINEL_EAGER:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
ops:
  security:
    secret: ${OPS_JWT_SECRET:}
    permit-all:
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
  monitor:
    prometheus-url: ${OPS_PROMETHEUS_URL:http://localhost:9090}
    grafana-url: ${OPS_GRAFANA_URL:http://localhost:3000}
    prometheus-public-url: ${OPS_PROMETHEUS_PUBLIC_URL:http://localhost:9090}
    grafana-public-url: ${OPS_GRAFANA_PUBLIC_URL:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
