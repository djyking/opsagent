server:
  port: 8101
spring:
  application:
    name: ops-auth-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${OPS_AUTH_DB_URL:jdbc:mysql://localhost:3306/ops_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${OPS_AUTH_DB_USERNAME:root}
    password: ${OPS_AUTH_DB_PASSWORD:}
  data:
    redis:
      host: ${OPS_REDIS_HOST:localhost}
      port: ${OPS_REDIS_PORT:6379}
      password: ${OPS_REDIS_PASSWORD:}
      database: ${OPS_REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      eager: ${SENTINEL_EAGER:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
ops:
  security:
    secret: ${OPS_JWT_SECRET:}
    access-token-ttl: 30m
    permit-all:
      - /api/auth/login
      - /api/auth/refresh
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  health:
    redis:
      enabled: ${OPS_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
