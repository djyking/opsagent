# Low-concurrency demo resource budget. Activate with SPRING_PROFILES_ACTIVE=demo.
# Standard Spring environment variables can override every setting below.
server:
  tomcat:
    threads:
      min-spare: 2
      max: 32
    max-connections: 256
    accept-count: 64
spring:
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 60000
ops:
  rag:
    stream:
      core-pool-size: 2
      max-pool-size: 8
      # Hand off immediately: long AI streams must not sit behind a large queue.
      queue-capacity: 0
      keep-alive-seconds: 30
      allow-core-thread-timeout: true
