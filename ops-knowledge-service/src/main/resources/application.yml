server: { port: 8103 }
spring:
  application: { name: ops-knowledge-service }
  config: { import: 'optional:nacos:${spring.application.name}.yaml' }
  datasource: { url: '${OPS_KNOWLEDGE_DB_URL:jdbc:mysql://localhost:3306/ops_knowledge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}', username: '${OPS_KNOWLEDGE_DB_USERNAME:root}', password: '${OPS_KNOWLEDGE_DB_PASSWORD:}' }
  cloud: { nacos: { config: { enabled: '${NACOS_CONFIG_ENABLED:false}', server-addr: '${NACOS_SERVER_ADDR:localhost:8848}' }, discovery: { enabled: '${NACOS_ENABLED:false}', server-addr: '${NACOS_SERVER_ADDR:localhost:8848}' } } }
ops: { security: { secret: '${OPS_JWT_SECRET:}', permit-all: [/actuator/health, /actuator/info] }, knowledge: { storage-root: '${OPS_UPLOAD_DIR:./data/uploads}' } }
management: { endpoints: { web: { exposure: { include: 'health,info,prometheus' } } } }
