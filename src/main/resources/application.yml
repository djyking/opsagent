spring:
  application:
    name: opsagent
  profiles:
    active: local
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:/mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ops-agent:
  document:
    storage-root: ${OPS_AGENT_DOCUMENT_STORAGE:./data/uploads}
    max-file-size: 10485760
  security:
    permit-all:
      - /api/auth/login
      - /api/auth/register
      - /actuator/health
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
    jwt:
      secret: ${OPS_AGENT_JWT_SECRET:}
      expire-minutes: 120
