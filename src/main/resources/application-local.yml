spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #加载环境变量，避免泄露敏感信息
    #密码由环境变量获取
    url: ${OPSAGENT_DB_URL:jdbc:mysql://localhost:3306/opsagent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${OPSAGENT_DB_USERNAME:root}
    password: ${OPSAGENT_DB_PASSWORD}
ops-agent:
  security:
    jwt:
      # 仅供本地开发兜底；部署环境必须通过环境变量覆盖。
      secret: ${OPS_AGENT_JWT_SECRET:opsagent-local-jwt-secret-2026-change-me}
