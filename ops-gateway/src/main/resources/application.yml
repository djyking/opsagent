server:
  port: ${OPS_GATEWAY_PORT:18080}
spring:
  application:
    name: ops-gateway
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      eager: ${SENTINEL_EAGER:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://ops-auth-service
              predicates:
                - Path=/api/auth/**
            - id: ticket
              uri: lb://ops-ticket-service
              predicates:
                - Path=/api/tickets/**
            - id: integrations
              uri: lb://ops-ticket-service
              predicates:
                - Path=/api/integrations/**
            - id: knowledge
              uri: lb://ops-knowledge-service
              predicates:
                - Path=/api/knowledge/**
            - id: rag
              uri: lb://ops-rag-service
              predicates:
                - Path=/api/rag/**
            - id: platform
              uri: lb://ops-platform-service
              predicates:
                - Path=/api/platform/**
ops:
  gateway:
    security:
      jwt-secret: ${OPS_JWT_SECRET:}
      # 仅跳过用户 JWT；工单服务仍用独立、常量时间比较的 Bearer Token 鉴权。
      public-paths:
        - /api/auth/login
        - /api/auth/refresh
        - /api/integrations/alertmanager/webhook
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
